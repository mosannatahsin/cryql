[tool.poetry]
name = "cryql"
version = "1.0.0"
description = "Evidence-driven GraphQL schema intelligence CLI"
authors = ["CryQL contributors"]
license = "MIT"
packages = [{ include = "cryql" }]
readme = "README.md"
homepage = "https://github.com/mosannatahsin/cryql"
repository = "https://github.com/mosannatahsin/cryql"

[tool.poetry.scripts]
cryql = "cryql.cli:main"

[tool.coverage.run]
omit = ["tests/*", "docs/*"]

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
aiohttp = { extras = ["speedups"], version = "^3.9.5" }

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
pytest-cov = "^5.0"

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"
